---
# tasks file for apache
- name: Install httpd and firewall package
  ansible.builtin.dnf:
    name:
      - "{{ web_pkg }}"
      - "{{ sec_pkg }}"
    state: present

- name: Enable and start services
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - "{{ web_svc }}"
    - "{{ sec_svc }}"

- name: Add http service in firewall
  ansible.posix.firewalld:
    service: "{{ rule }}"
    # port: 8080/tcp
    permanent: true
    state: enabled
    immediate: true

- name: Create index.html
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/html/index.html
    owner: root
    group: root
    mode: '0644'
    # setype: httpd_sys_content_t

  notify: Restart httpd
